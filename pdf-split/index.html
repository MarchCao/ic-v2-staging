<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 分割 · shift.haice.top</title>
<meta name="description" content="在浏览器本地分割 PDF：按页数、按范围、逐页拆分或提取指定页，页面原样复制不失真。不上传服务器，无广告，不收费。">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<header class="top">
  <a class="back" href="/">← 返回格式转换</a>
  <h1>✂️ PDF 分割</h1>
  <p class="tagline">把一个 PDF 按页拆开 · 页面原样复制，字体图片不失真</p>
</header>
<div id="status" class="status">请选择 PDF 文件开始。</div>

<main class="container">
  <div class="tip privacy">
    🔒 分割全部在您的设备本地完成。本工具不会将您的 PDF 上传到本网站服务器。处理结果默认仅保留在当前页面会话中。
  </div>

  <section class="card">
    <h2>步骤 1 · 上传 PDF</h2>
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择 PDF">
      <div class="dz-icon">📄</div>
      <div class="dz-text">点击选择 PDF，或拖拽到这里</div>
      <div class="dz-hint">支持大文件，全部在本地处理</div>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    </div>
    <div id="pdfInfo" class="info"></div>
  </section>

  <section class="card">
    <h2>步骤 2 · 选择分割方式</h2>
    <div class="modes">
      <label class="mode">
        <input type="radio" name="mode" value="chunk" checked>
        <span><b>按份拆分</b>：每 <input id="chunkSize" type="number" value="10" min="1" class="num"> 页一个文件</span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="ranges">
        <span><b>按范围拆分</b>：每行一个范围，每行生成一个文件</span>
      </label>
      <textarea id="rangeText" class="small-input" rows="4" placeholder="1-10&#10;11-20&#10;21-30" hidden></textarea>
      <label class="mode">
        <input type="radio" name="mode" value="single">
        <span><b>逐页拆分</b>：每一页单独一个文件</span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="extract">
        <span><b>提取页面</b>：把指定页抽出来合成一个文件</span>
      </label>
      <input id="extractSpec" type="text" class="small-input" placeholder="例如 1,3,5-8" hidden>
    </div>
    <div id="planInfo" class="info"></div>
  </section>

  <section class="card">
    <h2>步骤 3 · 分割并下载</h2>
    <button id="btnSplit" class="btn primary" disabled>分割并下载</button>
    <div id="gateHint" class="hint">请先上传 PDF。</div>
    <div id="result" class="info"></div>
    <div class="hint">生成多个文件时，会打包成一个 ZIP 一次下载；只生成一个文件时直接下载 PDF。</div>
  </section>

  <div class="row end">
    <button id="btnClear" class="btn danger">🗑 清除当前会话</button>
  </div>
  <p class="foot">全部处理在浏览器本地进行 · 无广告 · 不收费</p>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
